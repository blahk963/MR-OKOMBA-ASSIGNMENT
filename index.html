<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Moving Car</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; }
  body {
    overflow: hidden;
    background: linear-gradient(#7ec4e8 0%, #d9f0fa 55%);
  }

  /* ---------- Scene / camera ---------- */
  .stage {
    position: absolute;
    inset: 0;
    perspective: 2600px;
    perspective-origin: 50% 30%;
  }
  .world {
    position: absolute;
    left: 50%;
    top: 62%;
    transform-style: preserve-3d;
    transform: rotateX(-14deg) rotateY(-10deg);   /* camera angle */
  }

  /* ---------- Ground and road ---------- */
  .ground {
    position: absolute;
    width: 9000px;
    height: 6000px;
    left: -4500px;
    top: -3000px;
    background: #6a994e;
    transform: rotateX(90deg) translateY(-1600px);
  }
  .road {
    position: absolute;
    left: 0;
    width: 100%;
    top: 4470px;
    height: 260px;
    background: #3a3f47;
    border-top: 6px solid #f2f2f2;
    border-bottom: 6px solid #f2f2f2;
  }
  .road::after {
    content: "";
    position: absolute;
    left: 0;
    top: calc(50% - 4px);
    width: 100%;
    height: 8px;
    background: repeating-linear-gradient(90deg, #f6f6f6 0 80px, transparent 80px 160px);
  }

  /* ---------- Car ---------- */
  .car {
    position: absolute;
    left: 0;
    top: 0;
    transform-style: preserve-3d;
    animation: drive 8s linear infinite;
  }

  .shadow {
    position: absolute;
    left: -125px;
    top: -60px;
    width: 250px;
    height: 120px;
    border-radius: 50%;
    background: rgba(0, 0, 0, .35);
    filter: blur(6px);
    transform: rotateX(90deg) translateZ(2px);
  }

  /* Generic 3D box: set --l (length), --h (height), --d (depth), --x, --y */
  .box {
    position: absolute;
    left: var(--x);
    top: var(--y);
    width: var(--l);
    height: var(--h);
    transform-style: preserve-3d;
  }
  .box i { position: absolute; display: block; }

  .box .near, .box .far { width: var(--l); height: var(--h); }
  .box .near { transform: translateZ(calc(var(--d) / 2)); }
  .box .far  { transform: rotateY(180deg) translateZ(calc(var(--d) / 2)); }

  .box .nose, .box .rear {
    width: var(--d);
    height: var(--h);
    left: calc((var(--l) - var(--d)) / 2);
  }
  .box .nose { transform: rotateY(90deg)  translateZ(calc(var(--l) / 2)); }
  .box .rear { transform: rotateY(-90deg) translateZ(calc(var(--l) / 2)); }

  .box .top, .box .bottom {
    width: var(--l);
    height: var(--d);
    top: calc((var(--h) - var(--d)) / 2);
  }
  .box .top    { transform: rotateX(90deg)  translateZ(calc(var(--h) / 2)); }
  .box .bottom { transform: rotateX(-90deg) translateZ(calc(var(--h) / 2)); }

  /* Body */
  .hull  { --l: 240px; --h: 40px; --d: 110px; --x: -120px; --y: -58px; }
  .hull .near   { background: #d62828; }
  .hull .far    { background: #b01f1f; }
  .hull .nose   { background: #c1121f; }
  .hull .rear   { background: #8f1017; }
  .hull .top    { background: #ef4b4b; }
  .hull .bottom { background: #1b1b1b; }

  .hull .near::after {              /* door line */
    content: "";
    left: 50%;
    top: 0;
    width: 2px;
    height: 100%;
    position: absolute;
    background: rgba(0, 0, 0, .25);
  }
  .hull .nose::before, .hull .nose::after,
  .hull .rear::before, .hull .rear::after {
    content: "";
    position: absolute;
    top: 10px;
    width: 18px;
    height: 10px;
    border-radius: 3px;
  }
  .hull .nose::before, .hull .rear::before { left: 8px; }
  .hull .nose::after,  .hull .rear::after  { right: 8px; }
  .hull .nose::before, .hull .nose::after { background: #ffd166; box-shadow: 0 0 14px #ffd166; }
  .hull .rear::before, .hull .rear::after { background: #ff5a5a; }

  /* Cabin */
  .cabin { --l: 120px; --h: 36px; --d: 100px; --x: -80px; --y: -94px; }
  .cabin .near, .cabin .far, .cabin .nose, .cabin .rear {
    background: linear-gradient(135deg, #cfeaf8, #8fc3e3);
    border: 5px solid #d62828;
  }
  .cabin .top    { background: #ef4b4b; }
  .cabin .bottom { background: #8f1017; }

  /* Wheels */
  .wheel {
    position: absolute;
    width: 44px;
    height: 44px;
    left: calc(var(--x) - 22px);
    top: -44px;
    border-radius: 50%;
    background: radial-gradient(circle, #cfcfcf 0 30%, #111 32%);
    animation: spin .5s linear infinite;
  }
  .wheel::after {                   /* spoke, so the spin is visible */
    content: "";
    position: absolute;
    left: 20%;
    right: 20%;
    top: calc(50% - 2px);
    height: 4px;
    border-radius: 2px;
    background: #666;
  }

  /* ---------- Animations ---------- */
  @keyframes drive {
    from { transform: translateX(-1100px); }
    to   { transform: translateX(1100px); }
  }
  @keyframes spin {
    from { transform: translateZ(var(--z)) rotate(0deg); }
    to   { transform: translateZ(var(--z)) rotate(calc(360deg * var(--dir))); }
  }

  @media (prefers-reduced-motion: reduce) {
    .car { animation-duration: 24s; }
    .wheel { animation-duration: 1.5s; }
  }
</style>
</head>
<body>

  <div class="stage">
    <div class="world">

      <div class="ground"><div class="road"></div></div>

      <div class="car">
        <div class="shadow"></div>

        <div class="box hull">
          <i class="near"></i><i class="far"></i>
          <i class="nose"></i><i class="rear"></i>
          <i class="top"></i><i class="bottom"></i>
        </div>

        <div class="box cabin">
          <i class="near"></i><i class="far"></i>
          <i class="nose"></i><i class="rear"></i>
          <i class="top"></i><i class="bottom"></i>
        </div>

        <!-- near side wheels -->
        <div class="wheel" style="--x:-75px; --z:57px;  --dir:1"></div>
        <div class="wheel" style="--x:75px;  --z:57px;  --dir:1"></div>
        <!-- far side wheels -->
        <div class="wheel" style="--x:-75px; --z:-57px; --dir:-1"></div>
        <div class="wheel" style="--x:75px;  --z:-57px; --dir:-1"></div>
      </div>

    </div>
  </div>

</body>
</html>
