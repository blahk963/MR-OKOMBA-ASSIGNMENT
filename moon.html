<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Moving Moon</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }

  body {
    background: radial-gradient(ellipse at 50% 100%, #1b2a4a 0%, #0a1020 55%, #03050c 100%);
  }

  /* ---------- Stars ---------- */
  .stars {
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(1.5px 1.5px at 20px 30px,  #fff, transparent),
      radial-gradient(1px   1px   at 90px 120px, #fff, transparent),
      radial-gradient(2px   2px   at 160px 60px, #dfe9ff, transparent),
      radial-gradient(1px   1px   at 220px 180px,#fff, transparent),
      radial-gradient(1.5px 1.5px at 300px 90px, #fff, transparent),
      radial-gradient(1px   1px   at 60px 220px, #cfe0ff, transparent);
    background-size: 340px 260px;
    opacity: .8;
  }

  /* ---------- 3D scene ---------- */
  .scene {
    position: absolute;
    inset: 0;
    perspective: 900px;
    perspective-origin: 50% 60%;
  }

  /* Moves the moon from one point to another along an arc */
  .orbit {
    position: absolute;
    left: 50%;
    top: 55%;
    width: 0;
    height: 0;
    transform-style: preserve-3d;
    animation: travel 14s ease-in-out infinite alternate;
  }

  /* ---------- Moon ---------- */
  .moon {
    position: absolute;
    width: 200px;
    height: 200px;
    left: -100px;
    top: -100px;
    border-radius: 50%;
    background: #e9e7dc;
    overflow: hidden;
    box-shadow:
      0 0 60px 10px rgba(255, 255, 225, .25),
      0 0 160px 40px rgba(180, 200, 255, .15);
  }

  /* Craters: the texture slides sideways so the moon looks like it is rotating */
  .moon::before {
    content: "";
    position: absolute;
    inset: 0;
    background-image:
      radial-gradient(circle 22px at  70px  70px, rgba(70,70,70,.55), rgba(120,120,120,.25) 70%, transparent 74%),
      radial-gradient(circle 12px at 170px  50px, rgba(70,70,70,.55), rgba(120,120,120,.25) 70%, transparent 74%),
      radial-gradient(circle 30px at 250px 120px, rgba(70,70,70,.5),  rgba(120,120,120,.2)  70%, transparent 74%),
      radial-gradient(circle 14px at 320px  60px, rgba(70,70,70,.55), rgba(120,120,120,.25) 70%, transparent 74%),
      radial-gradient(circle 18px at 120px 150px, rgba(70,70,70,.5),  rgba(120,120,120,.2)  70%, transparent 74%),
      radial-gradient(circle 10px at 370px 160px, rgba(70,70,70,.55), rgba(120,120,120,.25) 70%, transparent 74%);
    background-size: 400px 200px;
    background-repeat: repeat-x;
    animation: rotate-surface 40s linear infinite;
  }

  /* Lighting: bright on the upper left, shadow on the lower right */
  .moon::after {
    content: "";
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, transparent 0%, rgba(0,0,0,.35) 60%, rgba(0,0,0,.85) 100%);
    box-shadow: inset -18px -18px 50px rgba(0, 0, 0, .75);
  }

  /* ---------- Animations ---------- */
  @keyframes travel {
    0%   { transform: translate3d(-42vw,  25vh, -500px) scale(.7); }
    50%  { transform: translate3d(  0vw, -22vh,  120px) scale(1.2); }
    100% { transform: translate3d( 42vw,  25vh, -500px) scale(.7); }
  }
  @keyframes rotate-surface {
    to { background-position-x: -400px; }
  }

  @media (prefers-reduced-motion: reduce) {
    .orbit { animation-duration: 60s; }
    .moon::before { animation-duration: 160s; }
  }
</style>
</head>
<body>

  <div class="stars"></div>

  <div class="scene">
    <div class="orbit">
      <div class="moon"></div>
    </div>
  </div>

</body>
</html>
