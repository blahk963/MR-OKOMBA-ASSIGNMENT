<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>3D Bouncing Ball</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body { height: 100%; overflow: hidden; }
  body { background: linear-gradient(#1a1f3a 0%, #3b4372 45%, #6c74a8 100%); }

  /* ---------- 3D floor (perspective grid) ---------- */
  .floor-wrap {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55vh;
    perspective: 500px;
    perspective-origin: 50% 0%;
    overflow: hidden;
  }
  .floor {
    position: absolute;
    left: -100%;
    top: 0;
    width: 300%;
    height: 220%;
    transform-origin: 50% 0;
    transform: rotateX(68deg);
    background: conic-gradient(#2b2f4a 25%, #454b78 0 50%, #2b2f4a 0 75%, #454b78 0);
    background-size: 12vmax 12vmax;
  }
  .fade {
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55vh;
    background: linear-gradient(#3b4372 0%, transparent 35%);
    pointer-events: none;
  }

  /* ---------- Ball ---------- */
  .track {
    position: absolute;
    left: 50%;
    bottom: 22vh;
    width: 0;
    height: 0;
    animation: travel 10s ease-in-out infinite alternate;
  }
  .shadow {
    position: absolute;
    left: -8vmin;
    bottom: -2.5vmin;
    width: 16vmin;
    height: 5vmin;
    border-radius: 50%;
    background: rgba(0, 0, 0, .55);
    filter: blur(4px);
    animation: shadow 1.2s linear infinite;
  }
  .bounce {
    position: absolute;
    left: -7vmin;
    bottom: 0;
    width: 14vmin;
    height: 14vmin;
    animation: bounce 1.2s linear infinite;
  }
  .ball {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    transform-origin: 50% 100%;
    background:
      radial-gradient(circle at 34% 28%, rgba(255,255,255,.9) 0 6%, transparent 18%),
      radial-gradient(circle at 36% 30%, #ff9a8b 0%, #e63946 45%, #7a0f1b 100%);
    box-shadow: inset -1.2vmin -1.4vmin 3vmin rgba(0, 0, 0, .45);
    animation: squash 1.2s linear infinite;
  }

  /* ---------- Animations ---------- */
  @keyframes travel {
    from { transform: translate(-30vw, -7vh) scale(.65); }
    to   { transform: translate( 30vw,  7vh) scale(1.2); }
  }
  @keyframes bounce {
    0%   { transform: translateY(0);     animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
    50%  { transform: translateY(-36vh); animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
    100% { transform: translateY(0); }
  }
  @keyframes squash {
    0%   { transform: scale(1.2, .75); }
    8%   { transform: scale(.94, 1.08); }
    16%  { transform: scale(1, 1); }
    84%  { transform: scale(1, 1); }
    94%  { transform: scale(.96, 1.06); }
    100% { transform: scale(1.2, .75); }
  }
  @keyframes shadow {
    0%   { transform: scale(1);   opacity: 1;  animation-timing-function: cubic-bezier(.2, .6, .4, 1); }
    50%  { transform: scale(.45); opacity: .3; animation-timing-function: cubic-bezier(.6, 0, .8, .4); }
    100% { transform: scale(1);   opacity: 1; }
  }

  @media (prefers-reduced-motion: reduce) {
    .track { animation-duration: 30s; }
    .bounce, .ball, .shadow { animation-duration: 3s; }
  }
</style>
</head>
<body>

  <div class="floor-wrap"><div class="floor"></div></div>
  <div class="fade"></div>

  <div class="track">
    <div class="shadow"></div>
    <div class="bounce"><div class="ball"></div></div>
  </div>

</body>
</html>
